<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Northstar Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body class="admin-body">
    <header class="topbar admin-topbar">
      <div class="container nav-wrap">
        <div class="brand">
          <span class="brand-mark">N</span>
          <span>Northstar Admin</span>
        </div>
        <div class="nav-actions">
          <a href="/" class="ghost-button anchor-button">Storefront</a>
        </div>
      </div>
    </header>

    <main class="container admin-layout">
      <section class="admin-panel analytics-panel">
        <h2>Business snapshot</h2>
        <div id="stats-grid" class="stats-grid"></div>
        <div class="low-stock-block">
          <h3>Low-stock alerts</h3>
          <div id="low-stock-list" class="low-stock-list"></div>
        </div>
      </section>

      <section class="admin-panel">
        <h2>Add or update product</h2>
        <form id="product-form">
          <input type="hidden" id="product-id" />
          <div class="form-grid admin-grid">
            <label>
              Product name
              <input id="product-name" name="name" type="text" required />
            </label>
            <label>
              Category
              <select id="product-category" name="category_id" required></select>
            </label>
            <label>
              Price
              <input id="product-price" name="price" type="number" step="0.01" min="0.01" required />
            </label>
            <label>
              Stock
              <input id="product-stock" name="stock" type="number" min="0" required />
            </label>
            <label>
              Image URL
              <input id="product-image" name="image_url" type="url" />
            </label>
            <label>
              Rating
              <input id="product-rating" name="rating" type="number" step="0.1" min="0" max="5" value="4.5" />
            </label>
            <label class="full-width">
              Description
              <textarea id="product-description" name="description" rows="4" required></textarea>
            </label>
            <label class="checkbox-row full-width">
              <input id="product-featured" name="featured" type="checkbox" />
              Featured product
            </label>
          </div>
          <div class="admin-actions">
            <button class="primary-button" type="submit">Save product</button>
            <button class="secondary-button" id="reset-form" type="button">Reset</button>
          </div>
        </form>
      </section>

      <section class="admin-panel product-table-panel">
        <h2>Inventory</h2>
        <div id="admin-product-list" class="admin-product-list"></div>
      </section>

      <section class="admin-panel orders-panel">
        <h2>Recent orders</h2>
        <div id="admin-orders-list" class="admin-orders-list"></div>
      </section>
    </main>

    <script src="/static/js/app.js"></script>
  </body>
</html>
