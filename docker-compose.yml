version: '3.9'

services:
  northstar-market:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: northstar-market
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      APP_NAME: Northstar Market
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      SESSION_SECRET_KEY: change-this-secret-in-production
      NORTHSTAR_DB_PATH: /app/data/retail_store.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
